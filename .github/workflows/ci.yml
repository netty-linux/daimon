name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  c2-offline:
    name: C2 offline lifecycle / Windows
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test clean-lab lifecycle with fault injection
        shell: pwsh
        run: |
          ./scripts/test-harness2-c2-lab.ps1
          ./scripts/test-harness2-c2-boot.ps1
          ./scripts/test-harness2-c2-deadline.ps1
          ./scripts/test-harness2-c2-watchdog.ps1
          ./scripts/test-harness2-c2-emergency-policy.ps1
          ./scripts/test-harness2-c2-cleanup.ps1
          ./scripts/test-harness2-c2-offline-entry.ps1
          ./scripts/harness2-c2-offline-entry.ps1 -OutputDirectory $env:RUNNER_TEMP -VerifyOnly
          ./scripts/test-harness2-c2-emergency.ps1

  ui:
    name: Web UI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check embedded build is current
        run: git diff --exit-code -- ../internal/server/ui

  linux:
    name: Go / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...
